repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.1.1
    hooks:
      - id: black
        name: black
        entry: black
        language: python
        require_serial: true
        types_or: [python, pyi]

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
    - id: isort
      name: isort
      entry: isort
      require_serial: true
      language: python
      types_or: [cython, pyi, python]
      args: ['--filter-files']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        entry: ruff check
        args: [ --fix ]

  # web/ (Astro site) — mirrors the checks in .github/workflows/validate.yaml.
  # pre-commit has no per-hook cwd, so each entry cds into web/ and runs the
  # matching bun script. pass_filenames is false because these tools glob the
  # whole project themselves (as they do in CI).
  - repo: local
    hooks:
      - id: web-astro-check
        name: astro check (web)
        entry: bash -c 'cd web && bun run check'
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-eslint
        name: eslint (web)
        entry: bash -c 'cd web && bun run lint'
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-prettier
        name: prettier (web)
        entry: bash -c 'cd web && bun run format:check'
        language: system
        files: ^web/
        pass_filenames: false
