name: Deploy web

# Builds the static Astro site (web/) and deploys it to Cloudflare Workers
# (assets-only Worker — see web/wrangler.toml).
#
# Data shards are NOT committed (see web/.gitignore); they are regenerated here
# from data/df.parquet, which the "Auto-update" ETL publishes to the `data`
# GitHub Release. This means every deploy — whether triggered by fresh data or a
# code change — rebuilds against the latest data without needing the ETL/API key.
#
# One-time setup required before this runs green:
#   1. Nothing to pre-create: `wrangler deploy` provisions the Worker named
#      `hdb-kaki` on first run.
#   2. Add repo secrets: CLOUDFLARE_API_TOKEN (with the "Edit Cloudflare Workers"
#      permission) and CLOUDFLARE_ACCOUNT_ID.

on:
  # Code changes to the site.
  push:
    branches: [main]
    paths:
      - "web/**"
      - "webapp/update/emit_web.py"
      - ".github/workflows/deploy.yaml"
  # PRs get a non-production preview version + a preview URL commented on the PR.
  pull_request:
    paths:
      - "web/**"
      - "webapp/update/emit_web.py"
      - ".github/workflows/deploy.yaml"
  # Fresh data: run after the daily ETL finishes.
  workflow_run:
    workflows: ["Auto-update"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # so the preview job can comment the preview URL

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip when chained off a failed ETL run; always run for push / manual.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Download latest parquet from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data --pattern df.parquet --dir data --clobber

      - name: Emit web data artifacts (year-sharded parquet + manifest)
        # shapely: point-in-polygon of transactions into subzones for the choropleth.
        run: uv run --with polars --with shapely webapp/update/emit_web.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install and build site
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Deploy to Cloudflare Workers
        id: wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # Reads the Worker name and [assets] dir (./dist) from wrangler.toml.
          # PRs upload a preview version (never touches production); everything
          # else (main push / manual / post-ETL) deploys to production.
          command: ${{ github.event_name == 'pull_request' && 'versions upload' || 'deploy' }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          # Passed via env (not string-interpolated into the script) so wrangler
          # output can't break the JS or inject code.
          WRANGLER_OUTPUT: ${{ steps.wrangler.outputs.command-output }}
        with:
          script: |
            const out = process.env.WRANGLER_OUTPUT || '';
            const match = out.match(/https:\/\/\S+\.workers\.dev/);
            const marker = '<!-- cf-preview-url -->';
            const body = match
              ? `${marker}\n🔎 **Preview deploy:** ${match[0]}\n\n_Uploaded from ${context.sha.slice(0, 7)}. Preview versions are non-production._`
              : `${marker}\n⚠️ Preview version uploaded, but no preview URL was found in the wrangler output — check the workflow logs.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
