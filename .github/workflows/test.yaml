name: Test web

# End-to-end tests for the static Astro site (web/). Runs the real production
# serving path — `bun run build` then `wrangler dev` (so src/worker.ts serves the
# brotli-compressed DuckDB-WASM engine) — and drives it with Playwright/Chromium.
#
# The data shards are NOT committed (see web/.gitignore); like the deploy workflow,
# we regenerate them here from data/df.parquet published to the `data` GitHub
# Release, so the engine can boot end-to-end (register shards + create the view).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "webapp/update/emit_web.py"
      - ".github/workflows/test.yaml"
  pull_request:
    paths:
      - "web/**"
      - "webapp/update/emit_web.py"
      - ".github/workflows/test.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Download latest parquet from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data --pattern df.parquet --dir data --clobber

      - name: Emit web data artifacts (year-sharded parquet + manifest)
        run: uv run --with polars webapp/update/emit_web.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # Guards the "no manual work" contract for fonts: the committed woff2 in
      # src/assets/fonts/ must match what fonts.spec.mjs produces. Re-vendor and fail
      # if they drift (someone changed the spec without running `bun run vendor-fonts`).
      # This is the ONLY workflow that touches Google Fonts; deploy/lighthouse build
      # purely from the committed files. A Google outage soft-skips (warn, don't fail)
      # so it never reds an unrelated PR.
      - name: Check vendored fonts are up to date
        working-directory: web
        run: |
          if ! node scripts/vendor-fonts.mjs; then
            echo "::warning::Could not reach Google Fonts; skipping font drift check."
            git checkout -- src/assets/fonts 2>/dev/null || true
            exit 0
          fi
          # --porcelain catches modified, added AND deleted files (git diff alone
          # misses new untracked variants).
          if [ -n "$(git status --porcelain -- src/assets/fonts)" ]; then
            echo "::error::Vendored fonts are stale. Run 'bun run vendor-fonts' and commit src/assets/fonts/."
            git --no-pager status --porcelain -- src/assets/fonts
            exit 1
          fi
          echo "Vendored fonts match fonts.spec.mjs."

      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        run: bunx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
