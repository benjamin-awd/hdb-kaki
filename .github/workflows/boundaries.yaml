name: Update town boundaries

# Regenerates web/public/geo/sg-towns.geojson from the URA Master Plan planning-area
# boundaries on data.gov.sg (webapp/update/build_town_geojson.py) and commits it only
# when it changes. Unlike the daily price ETL, these boundaries move only when URA
# revises the Master Plan — a ~5-year statutory cycle — so this runs monthly (cheap)
# and is a no-op on almost every run. A commit here touches web/**, which triggers the
# "Deploy web" workflow to publish the refreshed map.

on:
  schedule:
    - cron: "0 21 1 * *" # 05:00 UTC / 13:00 SGT on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boundaries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Rebuild town boundary GeoJSON
        run: uv run --with shapely webapp/update/build_town_geojson.py

      - name: Commit and push if changed
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          if git diff --quiet -- web/public/geo/sg-towns.geojson; then
            echo "Boundaries unchanged — nothing to commit."
          else
            git add web/public/geo/sg-towns.geojson
            git commit -m "chore: refresh town boundary GeoJSON from URA Master Plan"
            git push
          fi
